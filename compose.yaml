name: deadline-tracker
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deadlines
      POSTGRES_USER: deadlines
      POSTGRES_PASSWORD: local_deadlines
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deadlines -d deadlines"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://deadlines:local_deadlines@postgres:5432/deadlines?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
